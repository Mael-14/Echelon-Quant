[alembic]
script_location = backend/alembic
prepend_sys_path = .
version_path_separator = os

# The real database URL is resolved at runtime from backend.shared.config.Settings
# (see backend/alembic/env.py) so it stays in sync with the services' own connection
# settings (POSTGRES_HOST/PORT/DB/USER/PASSWORD env vars). This is only a fallback.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/echelon_quant

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
