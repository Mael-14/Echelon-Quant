version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: echelon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-echelon_quant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-echelon_quant}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: echelon-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: backend/apps/api-gateway/Dockerfile
    container_name: echelon-api-gateway
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Echelon Quant}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-echelon_quant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      BOT_SERVICE_URL: ${BOT_SERVICE_URL:-http://bot-service:8000}
    # Explicit DNS: Docker-in-Docker's embedded resolver can fail to reach public DNS from
    # inside a container even when the host resolves fine (seen in GitHub Codespaces) - this
    # service calls out to Deriv's OAuth/account endpoints, so it needs working DNS.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bot-service:
        condition: service_started

  account-service:
    build:
      context: .
      dockerfile: backend/services/account-service/Dockerfile
    container_name: echelon-account-service
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Echelon Quant}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-echelon_quant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot-service:
    build:
      context: .
      dockerfile: backend/services/bot-service/Dockerfile
    container_name: echelon-bot-service
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Echelon Quant}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-echelon_quant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  market-data-service:
    build:
      context: .
      dockerfile: backend/services/market-data-service/Dockerfile
    container_name: echelon-market-data-service
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Echelon Quant}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-echelon_quant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      # Optional Deriv credentials for OTP-authenticated websocket (leave empty to use public feed)
      DERIV_TOKEN: ${DERIV_TOKEN:-}
      DERIV_ACCOUNT_ID: ${DERIV_ACCOUNT_ID:-}
      DERIV_APP_ID: ${DERIV_APP_ID:-}
    # Explicit DNS: Docker-in-Docker's embedded resolver can fail to reach public DNS from
    # inside a container even when the host resolves fine (seen in GitHub Codespaces) - this
    # service opens a live Deriv tick WebSocket, so it needs working DNS.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-off migration runner: `docker compose --profile tools run --rm migrate`.
  # Run this against a fresh database before starting the app services above -
  # they no longer create their own tables at startup (see backend/alembic/).
  migrate:
    build:
      context: .
      dockerfile: backend/apps/api-gateway/Dockerfile
    container_name: echelon-migrate
    working_dir: /app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-echelon_quant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres_data:
  redis_data:
